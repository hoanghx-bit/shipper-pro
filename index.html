<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Hàng Bánh Kẹo Hải Hà - Haihaco Catalog</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800" x-data="orderApp()">

    <!-- Header -->
    <header class="bg-red-600 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-wide">HAIHACO ORDERING</h1>
                <p class="text-xs text-red-100">Hệ thống đặt hàng sản phẩm chính hãng Hải Hà</p>
            </div>
            <div class="flex items-center space-x-4">
                <button @click="cartOpen = true" class="relative bg-red-700 hover:bg-red-800 px-4 py-2 rounded-lg flex items-center space-x-2 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span class="font-semibold">Giỏ hàng</span>
                    <span class="bg-white text-red-600 rounded-full px-2 py-0.5 text-xs font-bold" x-text="totalItems">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Sidebar Filter / Search -->
        <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm h-fit space-y-6">
            <h2 class="text-lg font-semibold border-b pb-2">Danh mục sản phẩm</h2>
            <div class="space-y-2">
                <button @click="selectedCategory = 'All'" :class="selectedCategory === 'All' ? 'bg-red-600 text-white' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition">Tất cả sản phẩm</button>
                <template x-for="category in categories" :key="category">
                    <button @click="selectedCategory = category" :class="selectedCategory === category ? 'bg-red-600 text-white' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition" x-text="category"></button>
                </template>
            </div>

            <div class="space-y-2 pt-4 border-t">
                <label class="text-sm font-semibold text-gray-600">Tìm kiếm sản phẩm</label>
                <input type="text" x-model="searchQuery" placeholder="Nhập tên hoặc mã code..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>
        </div>

        <!-- Product Grid -->
        <div class="lg:col-span-3 space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800" x-text="selectedCategory === 'All' ? 'Tất cả sản phẩm' : selectedCategory"></h2>
                <span class="text-sm text-gray-500" x-text="filteredProducts.length + ' sản phẩm'"></span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <template x-for="product in filteredProducts" :key="product.code">
                    <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden border flex flex-col justify-between">
                        <div class="p-5 space-y-3">
                            <span class="text-xs font-semibold px-2.5 py-1 bg-red-50 text-red-600 rounded-full" x-text="product.category"></span>
                            <h3 class="font-bold text-gray-800 text-base leading-snug" x-text="product.name"></h3>
                            <p class="text-xs text-gray-500" x-text="product.subName"></p>
                            
                            <div class="text-xs text-gray-600 space-y-1 pt-2 border-t">
                                <p><span class="font-medium">Quy cách thùng:</span> <span x-text="product.spec"></span></p>
                                <p><span class="font-medium">Mã code:</span> <span x-text="product.code"></span></p>
                                <p><span class="font-medium">Kích thước:</span> <span x-text="product.dimension"></span></p>
                            </div>
                        </div>

                        <div class="p-5 bg-gray-50 border-t flex items-center justify-between">
                            <div>
                                <span class="text-xs text-gray-500 block">Giá ước tính</span>
                                <span class="text-red-600 font-bold" x-text="formatCurrency(product.price) + ' đ'"></span>
                            </div>
                            <button @click="addToCart(product)" class="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition shadow-sm">
                                Thêm vào giỏ
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <!-- Cart Slide-over Modal -->
    <div x-show="cartOpen" class="fixed inset-0 z-50 overflow-hidden" style="display: none;">
        <div class="absolute inset-0 bg-black bg-opacity-50 transition-opacity" @click="cartOpen = false"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white shadow-xl flex flex-col">
                <div class="p-6 bg-red-600 text-white flex items-center justify-between">
                    <h2 class="text-lg font-bold">Giỏ Hàng Của Bạn</h2>
                    <button @click="cartOpen = false" class="text-white hover:text-gray-200">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>

                <div class="flex-1 overflow-y-auto p-6 space-y-4">
                    <template x-if="cart.length === 0">
                        <div class="text-center py-12 text-gray-500">
                            <p>Giỏ hàng của bạn đang trống.</p>
                        </div>
                    </template>
                    <template x-for="(item, index) in cart" :key="item.code">
                        <div class="flex justify-between items-center border-b pb-4">
                            <div class="space-y-1 flex-1 pr-4">
                                <h4 class="text-sm font-semibold text-gray-800" x-text="item.name"></h4>
                                <p class="text-xs text-gray-500" x-text="'Mã: ' + item.code"></p>
                                <p class="text-xs font-medium text-red-600" x-text="formatCurrency(item.price) + ' đ/thùng'"></p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button @click="updateQty(index, -1)" class="w-7 h-7 bg-gray-100 rounded flex items-center justify-center font-bold hover:bg-gray-200">-</button>
                                <span class="text-sm font-semibold w-6 text-center" x-text="item.quantity"></span>
                                <button @click="updateQty(index, 1)" class="w-7 h-7 bg-gray-100 rounded flex items-center justify-center font-bold hover:bg-gray-200">+</button>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="p-6 bg-gray-50 border-t space-y-4">
                    <div class="flex justify-between text-base font-bold">
                        <span>Tổng tiền ước tính:</span>
                        <span class="text-red-600" x-text="formatCurrency(totalAmount) + ' đ'"></span>
                    </div>
                    <button @click="checkoutOpen = true; cartOpen = false" :disabled="cart.length === 0" class="w-full bg-red-600 hover:bg-red-700 disabled:bg-gray-300 text-white font-semibold py-3 rounded-lg transition shadow">
                        Tiến Hành Đặt Hàng
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div x-show="checkoutOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display: none;">
        <div class="absolute inset-0 bg-black bg-opacity-50" @click="checkoutOpen = false"></div>
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 relative z-10 space-y-4">
            <h3 class="text-lg font-bold text-gray-800 border-b pb-2">Thông Tin Giao Hàng</h3>
            <form @submit.prevent="submitOrder" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Họ và tên khách hàng / Đại lý</label>
                    <input type="text" x-model="customer.name" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Số điện thoại liên hệ</label>
                    <input type="tel" x-model="customer.phone" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Địa chỉ nhận hàng</label>
                    <textarea x-model="customer.address" required rows="2" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Ghi chú đơn hàng</label>
                    <textarea x-model="customer.note" rows="2" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none"></textarea>
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" @click="checkoutOpen = false" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 rounded-lg text-sm transition">Hủy</button>
                    <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-lg text-sm transition shadow">Xác nhận gửi đơn</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Success Order Modal -->
    <div x-show="successModal" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display: none;">
        <div class="absolute inset-0 bg-black bg-opacity-50"></div>
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 relative z-10 text-center space-y-4">
            <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
            <h3 class="text-xl font-bold text-gray-800">Đặt hàng thành công!</h3>
            <p class="text-sm text-gray-600">Cảm ơn bạn đã đặt sản phẩm của Hải Hà. Đơn hàng của bạn đã được ghi nhận và gửi đến bộ phận kinh doanh.</p>
            <button @click="successModal = false; cart = []" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-lg text-sm transition">Trở về trang chủ</button>
        </div>
    </div>

    <!-- Script Data & Logic -->
    <script>
        function orderApp() {
            return {
                cartOpen: false,
                checkoutOpen: false,
                successModal: false,
                selectedCategory: 'All',
                searchQuery: '',
                categories: ['LongPie', 'Mercury', 'Crackers', 'Wafer', 'Biscuits & Cookies', 'Candies & Jelly', 'Chocolate & Soft Candies'],
                cart: [],
                customer: { name: '', phone: '', address: '', note: '' },
                
                // Dữ liệu sản phẩm mẫu tiêu biểu trích xuất từ catalog Hải Hà
                products: [
                    { name: 'LongPie Luxury Chocolate Pie', subName: 'Bánh kem Marshmallow phủ sô cô la', category: 'LongPie', spec: '468g x 8 hộp', code: 'S95054525B', dimension: '553x343x388 mm', price: 240000 },
                    { name: 'LongPie Standard Chocolate Pie', subName: 'Bánh kem Marshmallow phủ sô cô la', category: 'LongPie', spec: '252g x 12 hộp', code: 'S95052033', dimension: '633x273x298 mm', price: 150000 },
                    { name: 'LongPie Pandan Flavour', subName: 'Bánh kem Marshmallow phủ sô cô la hương cốm', category: 'LongPie', spec: '288g x 10 hộp', code: 'S95054730', dimension: '553x293x358 mm', price: 180000 },
                    { name: 'Mercury Custard Cream Cake', subName: 'Bánh nhân kem trứng (Vị Trứng Sữa)', category: 'Mercury', spec: '252g x 10 hộp', code: 'S95055867', dimension: '473x313x393 mm', price: 135000 },
                    { name: 'Mercury Custard Cake Strawberry', subName: 'Bánh nhân kem trứng vị Dâu', category: 'Mercury', spec: '252g x 10 hộp', code: 'S95057717', dimension: '473x313x393 mm', price: 135000 },
                    { name: 'Kami Seaweed Crackers', subName: 'Bánh Crackers tảo biển hộp cao cấp', category: 'Crackers', spec: '380g x 8 hộp', code: 'S95056727', dimension: '468x333x378 mm', price: 190000 },
                    { name: 'Coolte Sesame & Coconut Crackers', subName: 'Bánh mặn vừng dừa', category: 'Crackers', spec: '350g x 8 hộp', code: 'S95055997', dimension: '468x343x353 mm', price: 175000 },
                    { name: 'GaBi Rice Crackers (Sweet)', subName: 'Bánh gạo vị ngọt', category: 'Crackers', spec: '130g x 20 túi', code: 'S95054501', dimension: '439x299x334 mm', price: 210000 },
                    { name: 'Eliza Cream Wafer (Assorted)', subName: 'Bánh kem xốp hương trái cây tổng hợp', category: 'Wafer', spec: '145g x 40 túi', code: 'S95050749', dimension: '459x339x284 mm', price: 260000 },
                    { name: 'Miniwaf Cream Roll Wafer', subName: 'Bánh xốp ống Miniwaf nhân kem sôcôla', category: 'Wafer', spec: '300g x 15 túi', code: 'S95051173A', dimension: '633x308x208 mm', price: 225000 },
                    { name: 'Okie Vanilla Cream Biscuits', subName: 'Bánh biscuits kẹp kem vị vani', category: 'Biscuits & Cookies', spec: '366g x 8 hộp', code: 'S95057601', dimension: '468x303x348 mm', price: 195000 },
                    { name: 'SoZoll Egg & Milk Cookies', subName: 'Bánh cookies trứng sữa', category: 'Biscuits & Cookies', spec: '350g x 8 hộp', code: 'S95055768', dimension: '468x343x353 mm', price: 210000 },
                    { name: 'Pooz Fruit Jelly Candy', subName: 'Kẹo Jelly trái cây tổng hợp', category: 'Candies & Jelly', spec: '1000g x 6 túi', code: 'S95020254A', dimension: '383x363x173 mm', price: 300000 },
                    { name: 'Chip Chip Fruit Jelly Candy', subName: 'Kẹo jelly Chip Chip 2 lớp', category: 'Candies & Jelly', spec: '500g x 20 túi', code: 'S95020223', dimension: '413x263x208 mm', price: 450000 },
                    { name: 'Sokiss Milk Chocolate Bar', subName: 'Kẹo sô cô la thanh sữa', category: 'Chocolate & Soft Candies', spec: '100g x 30 thanh', code: 'S95021640', dimension: '268x193x128 mm', price: 330000 },
                    { name: 'Sofee Chocolate Covered Toffee', subName: 'Kẹo toffee phủ sô cô la', category: 'Chocolate & Soft Candies', spec: '250g x 20 túi', code: 'S95062278', dimension: '513x253x233 mm', price: 280000 }
                ],

                get filteredProducts() {
                    return this.products.filter(p => {
                        let matchesCategory = this.selectedCategory === 'All' || p.category === this.selectedCategory;
                        let matchesSearch = p.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || p.code.toLowerCase().includes(this.searchQuery.toLowerCase());
                        return matchesCategory && matchesSearch;
                    });
                },

                addToCart(product) {
                    let existing = this.cart.find(item => item.code === product.code);
                    if (existing) {
                        existing.quantity++;
                    } else {
                        this.cart.push({ ...product, quantity: 1 });
                    }
                    this.cartOpen = true;
                },

                updateQty(index, change) {
                    this.cart[index].quantity += change;
                    if (this.cart[index].quantity <= 0) {
                        this.cart.splice(index, 1);
                    }
                },

                get totalItems() {
                    return this.cart.reduce((sum, item) => sum + item.quantity, 0);
                },

                get totalAmount() {
                    return this.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                },

                formatCurrency(value) {
                    return new Intl.NumberFormat('vi-VN').format(value);
                },

                submitOrder() {
                    this.checkoutOpen = false;
                    this.successModal = true;
                }
            }
        }
    </script>
</body>
</html>
