<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Quản Lý Đơn Hàng - NPP Tiến Quý</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f6f9;
            --white: #ffffff;
            --border: #dee2e6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
        }
        .header { margin-bottom: 20px; }
        .header h1 { font-size: 1.5rem; color: #333; margin: 0; }
        
        /* Cấu trúc Tab dạng thẻ */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 5px;
        }
        .tab-btn {
            padding: 10px 20px;
            background-color: #e9ecef;
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: 600;
            color: #495057;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: var(--primary-color);
            color: var(--white);
            border-color: var(--primary-color);
        }
        .tab-content {
            display: none;
            background: var(--white);
            padding: 20px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .tab-content.active {
            display: block;
        }

        /* Elements */
        select, input {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-right: 10px;
        }
        button {
            padding: 8px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #218838; }
        
        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
        }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        
        #tongTien {
            font-size: 1.2rem;
            color: #dc3545;
            font-weight: bold;
            margin-top: 15px;
            text-align: right;
        }

        /* Filter Box trong Kho Hàng */
        .filter-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>NPP TIẾN QUÝ - BẢNG KÊ XNT HẢI HÀ</h1>
    </div>

    <!-- Vùng Tabs Dạng Thẻ -->
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'LenDon')">Lên Đơn</button>
        <button class="tab-btn" onclick="openTab(event, 'KhoHang')">Kho Hàng</button>
    </div>

    <!-- Tab 1: LÊN ĐƠN -->
    <div id="LenDon" class="tab-content active">
        <div style="margin-bottom: 20px;">
            <label><strong>Khách hàng:</strong></label>
            <input type="text" placeholder="Nhập tên khách hàng..." style="width: 250px;">
            <label style="margin-left: 20px;"><strong>Ngày:</strong></label>
            <input type="date" id="orderDate">
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <select id="productSelect" style="flex: 1;">
                <!-- Dữ liệu được JavaScript nạp vào -->
            </select>
            <input type="number" id="qtyInput" placeholder="Số lượng (Gói/Hộp)" min="1" value="1" style="width: 150px;">
            <button onclick="addToOrder()">Thêm vào đơn</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Tên Sản Phẩm</th>
                    <th class="text-center">Số lượng</th>
                    <th class="text-right">Đơn giá (VNĐ)</th>
                    <th class="text-right">Thành tiền (VNĐ)</th>
                    <th class="text-center">Thao tác</th>
                </tr>
            </thead>
            <tbody id="orderTableBody">
                <!-- Danh sách hàng trong đơn -->
            </tbody>
        </table>
        <div id="tongTien">Tổng cộng: 0 VNĐ</div>
    </div>

    <!-- Tab 2: KHO HÀNG -->
    <div id="KhoHang" class="tab-content">
        <div class="filter-box">
            <label><strong>Phân loại danh mục kho: </strong></label>
            <select id="categoryFilter" onchange="renderKhoHang()">
                <option value="Tất cả">Tất cả danh mục</option>
                <option value="Hàng thường">Hàng thường</option>
                <option value="Hàng tết">Hàng tết</option>
                <option value="Bánh mì">Bánh mì</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>TT</th>
                    <th>Sản Phẩm</th>
                    <th class="text-center">QC/T</th>
                    <th class="text-right">Giá Gói/Hộp</th>
                    <th class="text-right">Giá Thùng</th>
                    <th class="text-center">Phân loại</th>
                </tr>
            </thead>
            <tbody id="khoHangTableBody">
                <!-- Danh sách kho hàng -->
            </tbody>
        </table>
    </div>

    <script>
        // Dữ liệu sản phẩm trích xuất từ file Bảng Kê XNT Hải Hà
        // Giá trị được quy đổi x1000 cho thực tế (Ví dụ: 30 = 30,000 VNĐ)
        const dbProducts = [
            { id: 2, name: "Longpie 360g", qct: 8, priceBox: 30000, priceCarton: 240000, category: "Hàng thường" },
            { id: 3, name: "Longpie 216g", qct: 24, priceBox: 17000, priceCarton: 408000, category: "Hàng thường" },
            { id: 9, name: "Quế 125g", qct: 45, priceBox: 8500, priceCarton: 382500, category: "Hàng thường" },
            { id: 10, name: "Quế 300g", qct: 15, priceBox: 23000, priceCarton: 345000, category: "Hàng thường" },
            { id: 11, name: "Kem xốp 230g", qct: 30, priceBox: 14000, priceCarton: 420000, category: "Bánh mì" },
            { id: 13, name: "Coolte 270g", qct: 12, priceBox: 23000, priceCarton: 276000, category: "Hàng thường" },
            { id: 15, name: "Sozoli 185g", qct: 15, priceBox: 18000, priceCarton: 270000, category: "Hàng thường" },
            { id: 18, name: "Tảo biển 210g", qct: 12, priceBox: 19000, priceCarton: 228000, category: "Hàng thường" },
            { id: 22, name: "Chew nho 90g", qct: 60, priceBox: 6000, priceCarton: 360000, category: "Hàng tết" },
            { id: 25, name: "Chip 100g", qct: 40, priceBox: 9000, priceCarton: 360000, category: "Hàng tết" },
            { id: 32, name: "DOLLYA 300 đỏ", qct: 12, priceBox: 50000, priceCarton: 600000, category: "Hàng tết" }
        ];

        let orderItems = [];

        // Khởi tạo app
        document.getElementById('orderDate').valueAsDate = new Date();
        initProductSelect();
        renderKhoHang();

        // Xử lý chuyển Tab dạng thẻ
        function openTab(evt, tabName) {
            // Ẩn toàn bộ tab nội dung
            const tabcontent = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove("active");
            }
            // Xóa class active của tất cả các nút
            const tablinks = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            // Hiển thị tab hiện tại
            document.getElementById(tabName).style.display = "block";
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        // Đổ dữ liệu vào Select Box ở tab Lên Đơn
        function initProductSelect() {
            const select = document.getElementById("productSelect");
            select.innerHTML = '<option value="">-- Chọn sản phẩm --</option>';
            dbProducts.forEach(p => {
                select.innerHTML += `<option value="${p.id}">${p.name} - ${p.priceBox.toLocaleString()} đ/hộp</option>`;
            });
        }

        // Logic Lên Đơn
        function addToOrder() {
            const select = document.getElementById("productSelect");
            const prodId = parseInt(select.value);
            const qty = parseInt(document.getElementById("qtyInput").value);

            if (!prodId || qty < 1) {
                alert("Vui lòng chọn sản phẩm và nhập số lượng hợp lệ!");
                return;
            }

            const product = dbProducts.find(p => p.id === prodId);
            
            // Kiểm tra xem sản phẩm đã có trong giỏ chưa
            const existingItem = orderItems.find(item => item.id === prodId);
            if (existingItem) {
                existingItem.qty += qty;
            } else {
                orderItems.push({
                    id: product.id,
                    name: product.name,
                    price: product.priceBox,
                    qty: qty
                });
            }
            renderOrder();
        }

        function removeOrder(index) {
            orderItems.splice(index, 1);
            renderOrder();
        }

        function renderOrder() {
            const tbody = document.getElementById("orderTableBody");
            tbody.innerHTML = "";
            let total = 0;

            orderItems.forEach((item, index) => {
                const rowTotal = item.price * item.qty;
                total += rowTotal;
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.name}</td>
                        <td class="text-center">${item.qty}</td>
                        <td class="text-right">${item.price.toLocaleString()}</td>
                        <td class="text-right">${rowTotal.toLocaleString()}</td>
                        <td class="text-center">
                            <button style="background-color: #dc3545; padding: 4px 8px;" onclick="removeOrder(${index})">Xóa</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById("tongTien").innerText = `Tổng cộng: ${total.toLocaleString()} VNĐ`;
        }

        // Logic Kho Hàng kèm Bộ Lọc Phân Loại
        function renderKhoHang() {
            const category = document.getElementById("categoryFilter").value;
            const tbody = document.getElementById("khoHangTableBody");
            tbody.innerHTML = "";

            const filteredProducts = category === "Tất cả" 
                ? dbProducts 
                : dbProducts.filter(p => p.category === category);

            filteredProducts.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td><strong>${p.name}</strong></td>
                        <td class="text-center">${p.qct}</td>
                        <td class="text-right">${p.priceBox.toLocaleString()}</td>
                        <td class="text-right">${p.priceCarton.toLocaleString()}</td>
                        <td class="text-center"><span style="background: #e9ecef; padding: 4px 8px; border-radius: 4px; font-size: 0.9em;">${p.category}</span></td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
