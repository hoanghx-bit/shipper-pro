
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ứng Dụng Quản Lý Đơn Hàng Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    /* Dự phòng trường hợp Tailwind tải chậm, đảm bảo tab vẫn ẩn/hiện đúng */
    .hidden { display: none !important; }
    
    /* CSS hỗ trợ in ấn thu gọn */
    @media print {
      body { background: white; padding: 0; }
      .no-print { display: none !important; }
      .print-compact td, .print-compact th { padding: 4px 6px !important; font-size: 14px; }
      .print-compact input { border: none; background: transparent; padding: 0; margin: 0; font-size: 14px; font-weight: bold; width: 100%; text-align: right; }
    }
  </style>
</head>
<body class="bg-gray-100 font-sans p-2 md:p-6">
  <div class="max-w-6xl mx-auto bg-white shadow-md rounded-lg overflow-hidden">
    
    <!-- Navigation Tabs (Đã fix lỗi submit form ngầm) -->
    <div class="flex flex-wrap border-b bg-slate-800 text-white no-print">
      <button type="button" onclick="switchTab('len-don')" id="tab-len-don" class="px-4 py-3 font-semibold border-b-2 border-blue-500 bg-slate-700 w-1/2 md:w-auto">Lên Đơn Hàng</button>
      <button type="button" onclick="switchTab('kho-hang')" id="tab-kho-hang" class="px-4 py-3 font-semibold hover:bg-slate-700 w-1/2 md:w-auto">Kho Hàng</button>
      <button type="button" onclick="switchTab('lich-su')" id="tab-lich-su" class="px-4 py-3 font-semibold hover:bg-slate-700 w-1/2 md:w-auto">Lịch Sử Đơn Hàng</button>
      <button type="button" onclick="switchTab('thong-ke')" id="tab-thong-ke" class="px-4 py-3 font-semibold hover:bg-slate-700 w-1/2 md:w-auto">Thống Kê Ngày</button>
    </div>

    <div class="p-4 md:p-6">
      
      <!-- TAB 1: FORM LÊN ĐƠN HÀNG -->
      <div id="sec-len-don" class="space-y-4">
        <h2 class="text-xl font-bold text-gray-800">Tạo Đơn Hàng Mới</h2>
        
        <div class="bg-blue-50 p-4 rounded border border-blue-200">
          <label class="block text-sm font-bold text-blue-900 mb-1">Tên Khách Hàng (Dùng chung cho toàn bộ bảng kê):</label>
          <input type="text" id="custName" placeholder="Nhập tên khách hàng..." class="w-full border-gray-300 shadow-sm p-2 rounded focus:ring-2 focus:ring-blue-500 font-semibold text-lg">
        </div>

        <form id="tempForm" onsubmit="addToTemp(event)" class="grid grid-cols-1 md:grid-cols-4 gap-3 bg-gray-50 p-4 rounded border">
          <div class="md:col-span-1">
            <label class="block text-xs font-medium mb-1 text-gray-600">Sản Phẩm</label>
            <select id="orderProduct" required class="w-full border p-2 rounded"></select>
          </div>
          <div>
            <label class="block text-xs font-medium mb-1 text-gray-600">Số Lượng</label>
            <input type="number" id="orderQty" min="0.1" step="any" required class="w-full border p-2 rounded">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1 text-gray-600">Đơn Vị Tính</label>
            <select id="orderUnit" class="w-full border p-2 rounded">
              <option value="Thùng">Thùng</option>
              <option value="Hộp">Hộp</option>
              <option value="Gói">Gói</option>
            </select>
          </div>
          <div class="flex items-end">
            <button type="submit" class="w-full bg-blue-100 text-blue-700 border border-blue-400 px-4 py-2 rounded font-semibold hover:bg-blue-200 transition-colors">Thêm Vào Bảng Kê ⬇</button>
          </div>
        </form>

        <div class="border rounded shadow-sm overflow-hidden">
          <table class="w-full text-left border-collapse bg-white">
            <thead class="bg-gray-100 text-sm text-gray-700">
              <tr>
                <th class="p-2 border-b">Sản Phẩm</th>
                <th class="p-2 border-b text-center">SL</th>
                <th class="p-2 border-b text-right">Tạm Tính</th>
                <th class="p-2 border-b text-center w-12">Xoá</th>
              </tr>
            </thead>
            <tbody id="tempTableBody">
              <tr><td colspan="4" class="p-4 text-center text-gray-400 italic">Bảng kê trống</td></tr>
            </tbody>
          </table>
        </div>

        <div class="flex justify-end pt-2">
          <button type="button" onclick="saveFinalOrder()" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold text-lg hover:bg-blue-700 shadow-md transition-colors">LƯU ĐƠN HÀNG NÀY</button>
        </div>
      </div>

      <!-- TAB 2: KHO HÀNG -->
      <div id="sec-kho-hang" class="hidden space-y-4">
        <h2 class="text-xl font-bold text-gray-800">Quản Lý Kho Hàng & Quy Cách</h2>
        <form onsubmit="saveProduct(event)" class="grid grid-cols-1 md:grid-cols-5 gap-3 bg-gray-50 p-4 rounded border">
          <input type="text" id="pName" placeholder="Tên sản phẩm" required class="border p-2 rounded md:col-span-1">
          
          <select id="pCategory" class="border p-2 rounded md:col-span-1 text-gray-700">
            <option value="Hàng thường">Hàng thường</option>
            <option value="Hàng tết">Hàng tết</option>
            <option value="Bánh mì">Bánh mì</option>
          </select>

          <input type="number" id="pPrice" placeholder="Đơn giá/Thùng (VNĐ)" required class="border p-2 rounded md:col-span-1">
          <input type="number" id="pSpec" placeholder="Lẻ/Thùng (vd: 20)" required class="border p-2 rounded md:col-span-1">
          
          <button type="submit" id="btnSaveProduct" class="bg-green-600 text-white px-4 py-2 rounded font-semibold hover:bg-green-700 md:col-span-1 transition-colors">Thêm SP</button>
        </form>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse border bg-white min-w-[600px]">
            <thead class="bg-gray-100">
              <tr>
                <th class="border p-2">Tên Sản Phẩm</th>
                <th class="border p-2">Phân Loại</th>
                <th class="border p-2">Đơn Giá / Thùng</th>
                <th class="border p-2">Quy Cách</th>
                <th class="border p-2 text-center">Thao Tác</th>
              </tr>
            </thead>
            <tbody id="inventoryTable"></tbody>
          </table>
        </div>
      </div>

      <!-- TAB 3: LỊCH SỬ ĐƠN HÀNG -->
      <div id="sec-lich-su" class="hidden space-y-4">
        <div class="flex flex-wrap justify-between items-center gap-4 bg-gray-50 p-3 rounded border">
          <div class="flex items-center gap-3">
            <label class="font-bold text-gray-700">Chọn ngày:</label>
            <input type="date" id="historyDate" onchange="renderHistory()" class="border-gray-300 p-2 rounded shadow-sm border font-semibold">
          </div>
          <button type="button" onclick="exportPDF()" class="bg-red-600 text-white px-4 py-2 rounded font-semibold hover:bg-red-700 flex items-center gap-2 transition-colors">
            Xuất PDF / In
          </button>
        </div>

        <div id="pdfContent" class="p-4 border rounded bg-white print-compact">
          <h2 id="pdfTitle" class="text-xl font-bold text-center mb-4 hidden">BẢNG KÊ ĐƠN HÀNG</h2>
          <div id="historyList"></div>
        </div>
      </div>

      <!-- TAB 4: THỐNG KÊ DOANH THU -->
      <div id="sec-thong-ke" class="hidden space-y-4">
        <div class="flex flex-wrap justify-between items-center gap-4 bg-gray-50 p-3 rounded border">
          <div class="flex items-center gap-3">
            <label class="font-bold text-gray-700">Chọn ngày:</label>
            <input type="date" id="statsDate" onchange="renderStats()" class="border-gray-300 p-2 rounded shadow-sm border font-semibold">
          </div>
          <div class="text-lg bg-white px-4 py-2 border rounded shadow-sm">
            <span class="font-bold text-gray-700">Tổng Doanh Thu: </span>
            <span id="totalRevenue" class="font-bold text-green-700 text-xl">0 đ</span>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse border bg-white min-w-[600px]">
            <thead class="bg-gray-100">
              <tr>
                <th class="border p-2">Sản Phẩm</th>
                <th class="border p-2">Đã Bán Thực Tế</th>
                <th class="border p-2">Quy Đổi Chuẩn</th>
              </tr>
            </thead>
            <tbody id="statsTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. TẠO ID CHUẨN ĐỂ KHÔNG BỊ LỖI KHI XOÁ/SỬA
    function generateId() {
      return Date.now().toString() + '-' + Math.floor(Math.random() * 1000);
    }

    // 2. LẤY NGÀY CHUẨN THEO GIỜ VIỆT NAM (Tránh lỗi lệch múi giờ)
    function getLocalDateStr() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // 3. TẢI DỮ LIỆU AN TOÀN (Chống crash web do dữ liệu cũ)
    let inventory = [];
    let orders = [];
    
    try {
      const savedInv = localStorage.getItem('app_inventory');
      inventory = savedInv ? JSON.parse(savedInv) : [
        { name: 'Bánh Mì', category: 'Bánh mì', price: 500000, spec: 20 },
        { name: 'Kẹo Thạch', category: 'Hàng thường', price: 300000, spec: 50 }
      ];
    } catch(e) { console.error("Lỗi dữ liệu Kho cũ, đã reset"); }

    try {
      const savedOrders = localStorage.getItem('app_orders');
      orders = savedOrders ? JSON.parse(savedOrders) : [];
    } catch(e) { console.error("Lỗi dữ liệu Đơn hàng cũ, đã reset"); }

    let tempOrders = []; 
    let editIndex = -1;

    // Gán ngày hiện tại
    const todayStr = getLocalDateStr();
    document.getElementById('historyDate').value = todayStr;
    document.getElementById('statsDate').value = todayStr;

    function saveData() {
      localStorage.setItem('app_inventory', JSON.stringify(inventory));
      localStorage.setItem('app_orders', JSON.stringify(orders));
    }

    // --- XỬ LÝ CHUYỂN TAB CHÍNH XÁC ---
    function switchTab(tab) {
      const tabs = ['len-don', 'kho-hang', 'lich-su', 'thong-ke'];
      tabs.forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).classList.remove('bg-slate-700', 'border-b-2', 'border-blue-500');
      });
      
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).classList.add('bg-slate-700', 'border-b-2', 'border-blue-500');
      
      if(tab === 'len-don') renderProductSelect();
      if(tab === 'kho-hang') renderInventory();
      if(tab === 'lich-su') renderHistory();
      if(tab === 'thong-ke') renderStats();
    }

    // --- LÊN ĐƠN HÀNG TẠM ---
    function addToTemp(e) {
      e.preventDefault();
      const product = document.getElementById('orderProduct').value;
      const quantity = parseFloat(document.getElementById('orderQty').value);
      const unit = document.getElementById('orderUnit').value;

      if(!product) { alert("Chưa có sản phẩm trong kho!"); return; }

      let totalPrice = 0;
      const prodObj = inventory.find(p => p.name === product);
      if (prodObj) {
        totalPrice = unit === 'Thùng' ? (quantity * prodObj.price) : (quantity * (prodObj.price / prodObj.spec));
      }

      tempOrders.push({
        tempId: generateId(),
        product, quantity, unit, totalPrice
      });

      renderTempTable();
      document.getElementById('orderQty').value = '';
    }

    function removeTemp(tempId) {
      tempOrders = tempOrders.filter(o => o.tempId !== tempId);
      renderTempTable();
    }

    function renderTempTable() {
      const tbody = document.getElementById('tempTableBody');
      if (tempOrders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-400 italic">Bảng kê trống</td></tr>';
        return;
      }
      
      tbody.innerHTML = tempOrders.map(item => `
        <tr class="border-b">
          <td class="p-2">${item.product}</td>
          <td class="p-2 text-center">${item.quantity} ${item.unit}</td>
          <td class="p-2 text-right font-medium">${Math.round(item.totalPrice).toLocaleString('vi-VN')} đ</td>
          <td class="p-2 text-center">
            <button type="button" onclick="removeTemp('${item.tempId}')" class="text-red-500 hover:text-red-700 font-bold text-lg">✖</button>
          </td>
        </tr>
      `).join('');
    }

    function saveFinalOrder() {
      const custName = document.getElementById('custName').value.trim();
      
      if (!custName) {
        alert("Vui lòng nhập Tên Khách Hàng trước khi lưu!");
        document.getElementById('custName').focus();
        return;
      }
      if (tempOrders.length === 0) {
        alert("Bảng kê đang trống. Vui lòng thêm sản phẩm!");
        return;
      }

      tempOrders.forEach(item => {
        orders.push({
          id: generateId(),
          customer: custName,
          product: item.product,
          quantity: item.quantity,
          unit: item.unit,
          date: getLocalDateStr(), // Lưu ngày hiện tại
          totalPrice: item.totalPrice
        });
      });

      saveData();
      tempOrders = [];
      document.getElementById('custName').value = '';
      renderTempTable();
      alert(`Đã lưu thành công đơn hàng cho khách: ${custName}`);
    }

    // --- KHO HÀNG ---
    function saveProduct(e) {
      e.preventDefault();
      const name = document.getElementById('pName').value.trim();
      const category = document.getElementById('pCategory').value;
      const price = parseFloat(document.getElementById('pPrice').value);
      const spec = parseInt(document.getElementById('pSpec').value);
      
      if (editIndex > -1) {
        inventory[editIndex] = { name, category, price, spec };
        editIndex = -1;
        const btn = document.getElementById('btnSaveProduct');
        btn.innerText = 'Thêm SP';
        btn.classList.replace('bg-yellow-500', 'bg-green-600');
        btn.classList.replace('hover:bg-yellow-600', 'hover:bg-green-700');
      } else {
        inventory.push({ name, category, price, spec });
      }

      saveData();
      renderInventory();
      renderProductSelect();
      e.target.reset();
    }

    function editProduct(index) {
      const p = inventory[index];
      document.getElementById('pName').value = p.name;
      document.getElementById('pCategory').value = p.category || 'Hàng thường';
      document.getElementById('pPrice').value = p.price;
      document.getElementById('pSpec').value = p.spec;
      editIndex = index;
      
      const btn = document.getElementById('btnSaveProduct');
      btn.innerText = 'Cập Nhật';
      btn.classList.replace('bg-green-600', 'bg-yellow-500');
    }

    function deleteProduct(index) {
      if(confirm('Xoá sản phẩm này khỏi kho?')) {
        inventory.splice(index, 1);
        saveData();
        renderInventory();
        renderProductSelect();
      }
    }

    function renderInventory() {
      const tbody = document.getElementById('inventoryTable');
      tbody.innerHTML = inventory.map((p, index) => `
        <tr class="border-b hover:bg-gray-50">
          <td class="p-2 font-medium">${p.name}</td>
          <td class="p-2 text-gray-600 text-sm">${p.category || 'Hàng thường'}</td>
          <td class="p-2 text-blue-700 font-semibold">${p.price.toLocaleString('vi-VN')} đ</td>
          <td class="p-2">${p.spec} Lẻ/Thùng</td>
          <td class="p-2 text-center whitespace-nowrap">
            <button type="button" onclick="editProduct(${index})" class="text-yellow-600 hover:text-yellow-800 font-bold mx-2">Sửa</button>
            <button type="button" onclick="deleteProduct(${index})" class="text-red-600 hover:text-red-800 font-bold mx-2">Xoá</button>
          </td>
        </tr>
      `).join('');
    }

    function renderProductSelect() {
      const select = document.getElementById('orderProduct');
      select.innerHTML = inventory.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
    }

    // --- LỊCH SỬ ĐƠN HÀNG (Cho phép Sửa giá, Xoá món) ---
    function updatePrice(id, newPriceInput) {
      const order = orders.find(o => o.id === id);
      if(order) {
        const parsedPrice = parseFloat(newPriceInput.replace(/[^0-9.-]+/g,""));
        if (!isNaN(parsedPrice)) {
            order.totalPrice = parsedPrice;
            saveData();
            renderHistory();
        }
      }
    }

    function deleteOrderItem(id) {
      if(confirm("Xoá sản phẩm này khỏi lịch sử đơn hàng? Khách không lấy nữa?")) {
        orders = orders.filter(o => o.id !== id);
        saveData();
        renderHistory();
      }
    }

    function renderHistory() {
      const selectedDate = document.getElementById('historyDate').value;
      const filteredOrders = orders.filter(o => o.date === selectedDate);
      const historyDiv = document.getElementById('historyList');

      if (filteredOrders.length === 0) {
        historyDiv.innerHTML = '<p class="text-gray-500 italic py-4">Không có đơn hàng nào trong ngày này.</p>';
        return;
      }

      const grouped = filteredOrders.reduce((acc, order) => {
        acc[order.customer] = acc[order.customer] || [];
        acc[order.customer].push(order);
        return acc;
      }, {});

      historyDiv.innerHTML = Object.keys(grouped).map(cust => {
        let totalCustomerPrice = 0;
        const rows = grouped[cust].map(item => {
          totalCustomerPrice += (item.totalPrice || 0);

          return `
            <tr class="border-b border-gray-100 last:border-0 hover:bg-gray-50">
              <td class="py-1 px-1 font-medium">${item.product}</td>
              <td class="py-1 px-1 text-center whitespace-nowrap text-gray-700">${item.quantity} ${item.unit}</td>
              <td class="py-1 px-1 text-right">
                 <!-- Ô input cho phép sửa giá trực tiếp (Ẩn khi in) -->
                 <input type="text" value="${Math.round(item.totalPrice||0)}" onchange="updatePrice('${item.id}', this.value)" class="w-full text-right border-b border-gray-300 focus:border-blue-500 bg-transparent px-1 text-blue-700 font-bold no-print" title="Có thể sửa giá trực tiếp">
                 <!-- Text tĩnh (Hiển thị khi in PDF) -->
                 <span class="hidden print:inline font-bold">${Math.round(item.totalPrice||0).toLocaleString('vi-VN')}</span>
              </td>
              <td class="py-1 px-1 text-center no-print w-8">
                 <button type="button" onclick="deleteOrderItem('${item.id}')" class="text-red-500 font-bold hover:text-red-700 text-lg">✖</button>
              </td>
            </tr>
          `;
        }).join('');

        return `
        <div class="border-b-2 border-dashed border-gray-400 pb-2 mb-3 last:border-0 break-inside-avoid">
          <div class="text-base font-extrabold text-black uppercase mb-1">${cust}</div>
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="text-gray-700 bg-gray-100 border-b border-gray-300">
                <th class="py-1 px-1 w-5/12">Sản Phẩm</th>
                <th class="py-1 px-1 w-2/12 text-center">SL</th>
                <th class="py-1 px-1 w-4/12 text-right">Thành Tiền</th>
                <th class="py-1 px-1 w-1/12 no-print"></th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
            <tfoot>
              <tr class="font-extrabold text-red-600 text-base">
                <td colspan="2" class="py-1 px-1 text-right">Tổng thanh toán:</td>
                <td class="py-1 px-1 text-right">${Math.round(totalCustomerPrice).toLocaleString(
