<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Quản Lý Bán Hàng & Kho</title>
    <!-- Thư viện hỗ trợ xuất PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #475569;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #1e293b;
            --accent-green: #16a34a;
            --accent-red: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 24px; color: var(--primary-color); }

        .nav-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card-btn { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; font-weight: bold; color: var(--secondary-color); transition: 0.2s; }
        .card-btn:hover { border-color: var(--primary-color); }
        .card-btn.active { border-color: var(--primary-color); background-color: #eff6ff; color: var(--primary-color); }

        .tab-content { display: none; background: var(--card-bg); border-radius: 8px; padding: 20px; border: 1px solid var(--border-color); }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 5px; font-size: 14px; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }

        .btn { padding: 8px 16px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-danger { background: var(--accent-red); color: white; padding: 4px 8px; font-size: 12px; }
        .btn-success { background: var(--accent-green); color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-secondary { background: #cbd5e1; color: #334155; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { background-color: #f1f5f9; }

        .summary-box { background: #f8fafc; border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; margin-top: 15px; }
        
        .order-history-card { background: #fff; border: 1px dashed var(--secondary-color); padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .order-history-card h3 { color: var(--primary-color); margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        .order-history-card .total-row { display: flex; justify-content: flex-end; font-size: 16px; font-weight: bold; margin-top: 10px; color: var(--accent-red); }
        
        /* Cài đặt danh sách inline */
        .cat-list-item { display: flex; justify-content: space-between; padding: 6px 10px; background: #fff; margin-bottom: 5px; border-radius: 4px; border: 1px solid var(--border-color); font-size: 14px;}
        .cat-list-item button { background: none; border: none; color: var(--accent-red); font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>QUẢN LÝ BÁN HÀNG & KHO HÀNG</h1>
    </header>

    <div class="nav-cards">
        <div class="card-btn active" onclick="switchTab(event, 'tab-kho')">📦 Tab Kho Hàng</div>
        <div class="card-btn" onclick="switchTab(event, 'tab-donhang')">🛒 Tab Lên Đơn Hàng</div>
        <div class="card-btn" onclick="switchTab(event, 'tab-lichsu')">📜 Lịch Sử & Xuất PDF</div>
    </div>

    <!-- TAB 1: KHO HÀNG -->
    <div id="tab-kho" class="tab-content active">
        <h2>Thêm Sản Phẩm Mới</h2>
        <form id="formKhoHang" style="margin-top: 10px;">
            <div class="form-row">
                <div class="form-group">
                    <label>Tên sản phẩm *</label>
                    <input type="text" id="tenSP" required placeholder="Tên sản phẩm">
                </div>
                
                <div class="form-group">
                    <label>Phân loại *</label>
                    <div style="display: flex; gap: 8px;">
                        <select id="loaiSP" required style="flex: 1;"></select>
                        <button type="button" class="btn btn-secondary" onclick="toggleCaiDat()">⚙️ Cài đặt</button>
                    </div>
                    
                    <!-- Khung cài đặt mở rộng (Ẩn đi theo mặc định) -->
                    <div id="khungCaiDat" style="display: none; background: #f1f5f9; padding: 12px; margin-top: 8px; border-radius: 6px; border: 1px dashed var(--secondary-color);">
                        <label style="color: var(--primary-color);">Quản lý Phân loại</label>
                        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                            <input type="text" id="nhapPhanLoai" placeholder="Nhập tên phân loại...">
                            <button type="button" class="btn btn-success" onclick="themPhanLoai()">Lưu</button>
                        </div>
                        <div id="danhSachPhanLoaiInline" style="max-height: 150px; overflow-y: auto;"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Đơn giá (Lẻ) *</label>
                    <input type="number" id="giaSP" required min="0" placeholder="0 VNĐ">
                </div>
                <div class="form-group">
                    <label>Quy cách (SL lẻ / 1 Thùng) *</label>
                    <input type="number" id="quyCach" required min="1" value="1" placeholder="Vd: 24 (hộp/thùng)">
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 5px;">➕ Thêm Sản Phẩm Vào Kho</button>
        </form>

        <h3 style="margin-top: 25px;">Danh Sách Mặt Hàng</h3>
        <table>
            <thead>
                <tr>
                    <th>Tên Sản Phẩm</th>
                    <th>Phân Loại</th>
                    <th>Đơn Giá Lẻ</th>
                    <th>Quy Cách Thùng</th>
                    <th>Thao Tác</th>
                </tr>
            </thead>
            <tbody id="bangKhoHang"></tbody>
        </table>
    </div>

    <!-- TAB 2: LÊN ĐƠN HÀNG -->
    <div id="tab-donhang" class="tab-content">
        <h2>Tạo Đơn Hàng</h2>
        <div class="form-row" style="margin-top: 10px;">
            <div class="form-group">
                <label>Tên khách hàng *</label>
                <input type="text" id="tenKhach" placeholder="Nhập tên khách hàng">
            </div>
        </div>

        <div class="form-row" style="background: #f1f5f9; padding: 12px; border-radius: 6px; align-items: end;">
            <div class="form-group">
                <label>Lọc phân loại</label>
                <select id="locLoaiDon" onchange="capNhatDropdownSP()"></select>
            </div>
            <div class="form-group">
                <label>Chọn hàng</label>
                <select id="selectSP"></select>
            </div>
            <div class="form-group" style="max-width: 120px;">
                <label>Số lượng</label>
                <input type="number" id="soluongMua" value="1" min="1">
            </div>
            <div class="form-group" style="max-width: 150px;">
                <label>Đơn vị</label>
                <select id="donViMua">
                    <option value="Lẻ">Lẻ (Gói/Hộp)</option>
                    <option value="Thùng">Thùng</option>
                </select>
            </div>
            <div class="form-group">
                <button type="button" class="btn btn-success" style="width: 100%; height: 36px;" onclick="themVaoGio()">+ Thêm</button>
            </div>
        </div>

        <h3 style="margin-top: 20px;">Danh Sách Mua</h3>
        <table>
            <thead>
                <tr>
                    <th>Sản Phẩm</th>
                    <th>Đơn Vị</th>
                    <th>Số Lượng</th>
                    <th>Thành Tiền</th>
                    <th>Xóa</th>
                </tr>
            </thead>
            <tbody id="bangGioHang"></tbody>
        </table>

        <div class="summary-box">
            <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px;">
                <span>Tổng tiền thanh toán:</span>
                <span id="tongThanhTien" style="color: var(--primary-color); font-size: 18px;">0 VNĐ</span>
            </div>
            <button type="button" class="btn btn-primary" style="width: 100%;" onclick="luuDonHang()">💾 Lưu Đơn Hàng</button>
        </div>
    </div>

    <!-- TAB 3: LỊCH SỬ -->
    <div id="tab-lichsu" class="tab-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2>Lịch Sử Đơn Hàng</h2>
            <div style="display: flex; gap: 10px;">
                <input type="date" id="ngayLoc" onchange="renderLichSu()" style="width: auto;">
                <button class="btn btn-warning" onclick="xuatPDF()">🖨️ Xuất PDF Ngày Này</button>
            </div>
        </div>
        
        <div id="vungXuatPDF" style="background: #fff; padding: 10px;">
            <div id="danhSachLichSu"></div>
        </div>
    </div>
</div>

<script>
    // --- KHỞI TẠO DỮ LIỆU TỪ LOCAL STORAGE ---
    let dsPhanLoai = ["Hàng thường", "Hàng Tết", "Bánh mì"];
    try {
        const storedPL = localStorage.getItem('DS_PHAN_LOAI');
        if (storedPL) {
            let parsed = JSON.parse(storedPL);
            if (Array.isArray(parsed) && parsed.length > 0) dsPhanLoai = parsed;
        }
    } catch(e) { console.warn("Lỗi tải phân loại, dùng mặc định."); }

    let dsKho = JSON.parse(localStorage.getItem('DS_KHO')) || [];
    let dsDonHang = JSON.parse(localStorage.getItem('DS_DON_HANG')) || [];
    let gioHang = [];

    // --- ĐIỀU HƯỚNG TAB ---
    function switchTab(e, tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.card-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        e.currentTarget.classList.add('active');

        if(tabId === 'tab-donhang') renderLocPhanLoai();
        if(tabId === 'tab-lichsu') setNgayHienTai();
    }

    // --- QUẢN LÝ PHÂN LOẠI TRỰC TIẾP (INLINE) ---
    function toggleCaiDat() {
        const khung = document.getElementById('khungCaiDat');
        if (khung.style.display === 'none') {
            khung.style.display = 'block';
            renderDanhSachPhanLoaiInline();
        } else {
            khung.style.display = 'none';
        }
    }

    function renderDropdownPhanLoai() {
        const selectKho = document.getElementById('loaiSP');
        selectKho.innerHTML = '';
        dsPhanLoai.forEach(loai => {
            selectKho.innerHTML += `<option value="${loai}">${loai}</option>`;
        });
        renderLocPhanLoai(); // Đồng bộ sang Tab Lên Đơn
    }

    function renderDanhSachPhanLoaiInline() {
        const div = document.getElementById('danhSachPhanLoaiInline');
        div.innerHTML = '';
        dsPhanLoai.forEach((loai, index) => {
            div.innerHTML += `
                <div class="cat-list-item">
                    <span>${loai}</span>
                    <button type="button" onclick="xoaPhanLoai(${index})">✖ Xóa</button>
                </div>
            `;
        });
    }

    function themPhanLoai() {
        const inputElement = document.getElementById('nhapPhanLoai');
        const val = inputElement.value.trim();
        
        if(!val) return alert("Vui lòng nhập tên phân loại!");
        if(dsPhanLoai.includes(val)) return alert("Phân loại này đã tồn tại!");
        
        dsPhanLoai.push(val);
        localStorage.setItem('DS_PHAN_LOAI', JSON.stringify(dsPhanLoai));
        inputElement.value = '';
        
        renderDanhSachPhanLoaiInline();
        renderDropdownPhanLoai();
    }

    function xoaPhanLoai(index) {
        if(confirm("Bạn có chắc muốn xóa phân loại này?")) {
            dsPhanLoai.splice(index, 1);
            localStorage.setItem('DS_PHAN_LOAI', JSON.stringify(dsPhanLoai));
            renderDanhSachPhanLoaiInline();
            renderDropdownPhanLoai();
        }
    }

    // --- QUẢN LÝ KHO HÀNG (ĐÃ BỎ TỒN KHO) ---
    document.getElementById('formKhoHang').addEventListener('submit', function(e) {
        e.preventDefault();
        const ten = document.getElementById('tenSP').value.trim();
        const loai = document.getElementById('loaiSP').value;
        const gia = Number(document.getElementById('giaSP').value);
        const quyCach = Number(document.getElementById('quyCach').value);

        dsKho.push({ id: Date.now(), ten, loai, gia, quyCach });
        luuKho();
        renderKho();
        this.reset();
        document.getElementById('quyCach').value = 1;
        alert("Thêm sản phẩm thành công!");
    });

    function luuKho() { localStorage.setItem('DS_KHO', JSON.stringify(dsKho)); }

    function renderKho() {
        const tbody = document.getElementById('bangKhoHang');
        tbody.innerHTML = '';
        dsKho.forEach(item => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${item.ten}</strong></td>
                    <td>${item.loai}</td>
                    <td>${item.gia.toLocaleString()} đ</td>
                    <td>${item.quyCach}</td>
                    <td><button type="button" class="btn btn-danger" onclick="xoaSPKho(${item.id})">Xóa</button></td>
                </tr>
            `;
        });
    }

    function xoaSPKho(id) {
        if(confirm("Xóa sản phẩm này khỏi danh sách?")) {
            dsKho = dsKho.filter(i => i.id !== id);
            luuKho(); renderKho();
        }
    }

    // --- LÊN ĐƠN HÀNG ---
    function renderLocPhanLoai() {
        const selectLoc = document.getElementById('locLoaiDon');
        if(!selectLoc) return;
        selectLoc.innerHTML = '<option value="TatCa">-- Tất cả phân loại --</option>';
        dsPhanLoai.forEach(loai => {
            selectLoc.innerHTML += `<option value="${loai}">${loai}</option>`;
        });
        capNhatDropdownSP();
    }

    function capNhatDropdownSP() {
        const loaiLoc = document.getElementById('locLoaiDon').value;
        const selectSP = document.getElementById('selectSP');
        selectSP.innerHTML = '';
        
        let dsLoc = dsKho;
        if(loaiLoc !== 'TatCa') dsLoc = dsKho.filter(sp => sp.loai === loaiLoc);

        if(dsLoc.length === 0) {
            selectSP.innerHTML = '<option value="">(Không có SP nào)</option>';
            return;
        }

        dsLoc.forEach(item => {
            selectSP.innerHTML += `<option value="${item.id}">${item.ten} (Quy cách: ${item.quyCach}/thùng)</option>`;
        });
    }

    function themVaoGio() {
        const id = Number(document.getElementById('selectSP').value);
        const sl = Number(document.getElementById('soluongMua').value);
        const donVi = document.getElementById('donViMua').value;
        const sp = dsKho.find(i => i.id === id);

        if(!sp) return alert("Vui lòng chọn sản phẩm!");
        if(sl <= 0) return alert("Số lượng phải lớn hơn 0!");

        const donGiaTinh = donVi === 'Thùng' ? sp.gia * sp.quyCach : sp.gia;
        const thanhTien = donGiaTinh * sl;

        gioHang.push({ id: sp.id, ten: sp.ten, sl: sl, donVi: donVi, thanhTien: thanhTien });
        renderGioHang();
    }

    function renderGioHang() {
        const tbody = document.getElementById('bangGioHang');
        tbody.innerHTML = '';
        let tongTien = 0;

        gioHang.forEach((item, index) => {
            tongTien += item.thanhTien;
            tbody.innerHTML += `
                <tr>
                    <td>${item.ten}</td>
                    <td>${item.donVi}</td>
                    <td>${item.sl}</td>
                    <td>${item.thanhTien.toLocaleString()} đ</td>
                    <td><button type="button" class="btn btn-danger" onclick="xoaItemGio(${index})">Xóa</button></td>
                </tr>
            `;
        });
        document.getElementById('tongThanhTien').innerText = tongTien.toLocaleString() + ' VNĐ';
    }

    function xoaItemGio(index) {
        gioHang.splice(index, 1);
        renderGioHang();
    }

    function luuDonHang() {
        const tenKhach = document.getElementById('tenKhach').value.trim();
        if(!tenKhach) return alert("Vui lòng nhập tên khách hàng!");
        if(gioHang.length === 0) return alert("Chưa có sản phẩm nào trong đơn!");

        let tongTien = 0;
        gioHang.forEach(item => {
            tongTien += item.thanhTien;
        });

        const ngayHienTai = new Date().toISOString().split('T')[0];
        const donHang = {
            id: 'DH' + Date.now().toString().slice(-6),
            ngayISO: ngayHienTai,
            khach: tenKhach,
            chiTiet: [...gioHang],
            tongTien: tongTien
        };

        dsDonHang.push(donHang);
        localStorage.setItem('DS_DON_HANG', JSON.stringify(dsDonHang));

        gioHang = [];
        document.getElementById('tenKhach').value = '';
        document.getElementById('soluongMua').value = 1;
        renderGioHang();
        alert("Đã lưu đơn hàng thành công!");
    }

    // --- LỊCH SỬ & XUẤT PDF ---
    function setNgayHienTai() {
        if(!document.getElementById('ngayLoc').value) {
            document.getElementById('ngayLoc').value = new Date().toISOString().split('T')[0];
        }
        renderLichSu();
    }

    function renderLichSu() {
        const divLichSu = document.getElementById('danhSachLichSu');
        const ngayLoc = document.getElementById('ngayLoc').value;
        divLichSu.innerHTML = '';

        const dsLocTheoNgay = dsDonHang.filter(d => d.ngayISO === ngayLoc);

        if(dsLocTheoNgay.length === 0) {
            divLichSu.innerHTML = '<p style="text-align:center; color: #64748b;">Không có đơn hàng nào trong ngày này.</p>';
            return;
        }

        dsLocTheoNgay.forEach(don => {
            let bangChiTiet = `
                <table style="margin-top: 5px; margin-bottom: 5px;">
                    <thead><tr><th>Sản phẩm</th><th>Đơn vị</th><th>Số lượng</th><th>Thành tiền</th></tr></thead>
                    <tbody>
            `;
            
            don.chiTiet.forEach(sp => {
                bangChiTiet += `<tr><td>${sp.ten}</td><td>${sp.donVi}</td><td>${sp.sl}</td><td>${sp.thanhTien.toLocaleString()} đ</td></tr>`;
            });

            bangChiTiet += `</tbody></table>`;

            divLichSu.innerHTML += `
                <div class="order-history-card">
                    <h3>Khách hàng: <strong>${don.khach}</strong> <span style="float:right; font-size:12px; color: #64748b;">Mã: #${don.id}</span></h3>
                    ${bangChiTiet}
                    <div class="total-row">Tổng tiền đơn hàng: ${don.tongTien.toLocaleString()} VNĐ</div>
                </div>
            `;
        });
    }

    function xuatPDF() {
