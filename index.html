<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App Quản Lý Đơn Hàng</title>
    <!-- Thư viện giao diện & Logic -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Thư viện đọc Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('Lên đơn');
            
            // State quản lý dữ liệu (Lưu vào LocalStorage để không mất khi f5)
            const [inventory, setInventory] = useState(() => JSON.parse(localStorage.getItem('db_inv')) || []);
            const [tempOrder, setTempOrder] = useState(() => JSON.parse(localStorage.getItem('db_temp')) || []);
            const [history, setHistory] = useState(() => JSON.parse(localStorage.getItem('db_hist')) || []);

            useEffect(() => localStorage.setItem('db_inv', JSON.stringify(inventory)), [inventory]);
            useEffect(() => localStorage.setItem('db_temp', JSON.stringify(tempOrder)), [tempOrder]);
            useEffect(() => localStorage.setItem('db_hist', JSON.stringify(history)), [history]);

            // Form States
            const [khachHang, setKhachHang] = useState('');
            const [sp, setSp] = useState('');
            const [sl, setSl] = useState(1);
            const [dv, setDv] = useState('Thùng');
            const [mau, setMau] = useState('');
            const [ck, setCk] = useState(0);

            // Hàm xử lý file Excel
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const bstr = evt.target.result;
                    const wb = XLSX.read(bstr, { type: 'binary' });
                    const wsname = wb.SheetNames[0];
                    const data = XLSX.utils.sheet_to_json(wb.Sheets[wsname]);
                    setInventory(data);
                    alert("Cập nhật kho thành công!");
                };
                reader.readAsBinaryString(file);
            };

            // Hàm tính tiền & thêm đơn
            const handleAddTemp = () => {
                const item = inventory.find(i => i['SẢN PHẨM'] === sp);
                if (!item) return alert("Vui lòng chọn sản phẩm hợp lệ từ kho!");

                const giaBan = dv === 'Thùng' ? item['GIÁ THÙNG BÁN'] : item['GIÁ LẺ BÁN'];
                const giaNet = dv === 'Thùng' ? item['GIÁ THÙNG NET'] : item['GIÁ LẺ NET'];
                
                const thanhTien = (giaBan * sl) - ck;
                const chenhLech = ((giaBan - giaNet) * sl) - ck;

                setTempOrder([...tempOrder, {
                    id: Date.now(), khachHang, sp, sl, dv, mau, ck, giaBan, giaNet, thanhTien, chenhLech
                }]);
            };

            // Hàm lưu đơn
            const handleSaveOrder = () => {
                const dateStr = new Date().toISOString().split('T')[0];
                const newOrders = tempOrder.map(o => ({ ...o, ngay: dateStr }));
                setHistory([...history, ...newOrders]);
                setTempOrder([]);
                setKhachHang('');
                alert("Đã lưu vào lịch sử!");
            };

            // Xuất file Word cơ bản (Sử dụng Blob HTML)
            const exportWord = (elementId, filename) => {
                const content = document.getElementById(elementId).innerHTML;
                const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset='utf-8'></head><body>${content}</body></html>`;
                const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename + '.doc';
                link.click();
            };

            return (
                <div className="max-w-6xl mx-auto bg-white rounded-lg shadow-md p-6">
                    {/* Thanh Navigation Dạng Thẻ */}
                    <div className="flex space-x-2 border-b mb-6">
                        {['Lên đơn', 'Kho', 'Lịch sử', 'Thống kê'].map(tab => (
                            <button
                                key={tab}
                                onClick={() => setActiveTab(tab)}
                                className={`px-6 py-2 rounded-t-lg font-semibold transition-colors ${activeTab === tab ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'}`}
                            >
                                {tab}
                            </button>
                        ))}
                    </div>

                    {/* NỘI DUNG CÁC TAB */}
                    
                    {/* Tab 1: Lên Đơn */}
                    {activeTab === 'Lên đơn' && (
                        <div>
                            <h2 className="text-xl font-bold mb-4">Lên Đơn Hàng</h2>
                            <div className="grid grid-cols-6 gap-4 mb-4">
                                <input placeholder="Tên Khách Hàng" className="border p-2 col-span-2" value={khachHang} onChange={e => setKhachHang(e.target.value)} />
                                <select className="border p-2 col-span-2" value={sp} onChange={e => setSp(e.target.value)}>
                                    <option value="">-- Chọn sản phẩm --</option>
                                    {inventory.map((i, idx) => <option key={idx} value={i['SẢN PHẨM']}>{i['SẢN PHẨM']}</option>)}
                                </select>
                                <input type="number" placeholder="Số lượng" className="border p-2" value={sl} onChange={e => setSl(Number(e.target.value))} min="1" />
                                <select className="border p-2" value={dv} onChange={e => setDv(e.target.value)}>
                                    <option value="Thùng">Thùng</option>
                                    <option value="Lẻ">Lẻ</option>
                                </select>
                                <input placeholder="Màu sắc" className="border p-2 col-span-2" value={mau} onChange={e => setMau(e.target.value)} />
                                <input type="number" placeholder="Chiết khấu (VNĐ)" className="border p-2 col-span-2" value={ck} onChange={e => setCk(Number(e.target.value))} />
                                <button onClick={handleAddTemp} className="bg-green-500 text-white p-2 rounded col-span-2 font-bold">Thêm Vào Đơn</button>
                            </div>

                            {tempOrder.length > 0 && (
                                <div className="mt-8 border-t pt-4">
                                    <h3 className="font-bold text-lg mb-2">Đơn tạm tính</h3>
                                    <table className="w-full text-left border-collapse mb-4">
                                        <thead>
                                            <tr className="bg-gray-100">
                                                <th className="border p-2">Khách Hàng</th>
                                                <th className="border p-2">Sản Phẩm</th>
                                                <th className="border p-2">SL</th>
                                                <th className="border p-2">Chiết khấu</th>
                                                <th className="border p-2">Thành Tiền</th>
                                                <th className="border p-2">Chênh lệch (Lãi)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {tempOrder.map(o => (
                                                <tr key={o.id}>
                                                    <td className="border p-2">{o.khachHang}</td>
                                                    <td className="border p-2">{o.sp}</td>
                                                    <td className="border p-2">{o.sl} {o.dv}</td>
                                                    <td className="border p-2">{o.ck.toLocaleString()} ₫</td>
                                                    <td className="border p-2">{o.thanhTien.toLocaleString()} ₫</td>
                                                    <td className="border p-2 text-green-600">{o.chenhLech.toLocaleString()} ₫</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    <div className="font-bold text-xl mb-4">Tổng tiền: {tempOrder.reduce((acc, curr) => acc + curr.thanhTien, 0).toLocaleString()} VNĐ</div>
                                    <button onClick={handleSaveOrder} className="bg-blue-600 text-white px-6 py-2 rounded font-bold">Lưu Đơn Hàng</button>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Tab 2: Kho */}
                    {activeTab === 'Kho' && (
                        <div>
                            <h2 className="text-xl font-bold mb-4">Quản Lý Kho Dữ Liệu</h2>
                            <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} className="mb-4 border p-2 w-full" />
                            <div className="overflow-auto max-h-[500px]">
                                <table className="w-full border text-sm">
                                    <thead className="bg-gray-100 sticky top-0">
                                        <tr>
                                            <th className="border p-2">SẢN PHẨM</th>
                                            <th className="border p-2">GIÁ THÙNG NET</th>
                                            <th className="border p-2">GIÁ THÙNG BÁN</th>
                                            <th className="border p-2">GIÁ LẺ BÁN</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {inventory.map((item, idx) => (
                                            <tr key={idx}>
                                                <td className="border p-2">{item['SẢN PHẨM']}</td>
                                                <td className="border p-2">{item['GIÁ THÙNG NET']}</td>
                                                <td className="border p-2">{item['GIÁ THÙNG BÁN']}</td>
                                                <td className="border p-2">{item['GIÁ LẺ BÁN']}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* Tab 3: Lịch Sử */}
                    {activeTab === 'Lịch sử' && (
                        <div>
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-xl font-bold">Lịch Sử Lên Đơn</h2>
                                <button onClick={() => exportWord('export-history', 'Lich_Su_Don_Hang')} className="bg-indigo-500 text-white px-4 py-2 rounded">Xuất File Word</button>
                            </div>
                            <div id="export-history" className="bg-white p-4 border min-h-[300px]">
                                {Array.from(new Set(history.map(h => h.ngay))).map(date => (
                                    <div key={date} className="mb-6">
                                        <h3 className="font-bold text-lg border-b pb-2">Ngày: {date}</h3>
                                        {Array.from(new Set(history.filter(h => h.ngay === date).map(h => h.khachHang))).map((kh, idx) => {
                                            const orders = history.filter(h => h.ngay === date && h.khachHang === kh);
                                            const tongTien = orders.reduce((sum, o) => sum + o.thanhTien, 0);
                                            return (
                                                <div key={kh} className="mt-4 mb-2">
                                                    <p className="font-bold">{idx + 1}. {kh}</p>
                                                    {orders.map((o, i) => (
                                                        <p key={i} className="ml-4">- {o.sp}: {o.sl} {o.dv} = {o.thanhTien.toLocaleString()} ₫</p>
                                                    ))}
                                                    {orders.length > 1 && <p className="ml-4 font-semibold mt-1">Tổng tiền: {tongTien.toLocaleString()} ₫</p>}
                                                </div>
                                            )
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Tab 4: Thống Kê */}
                    {activeTab === 'Thống kê' && (
                        <div>
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-xl font-bold">Thống Kê Bán Hàng</h2>
                                <button onClick={() => exportWord('export-stats', 'Thong_Ke_Ban_Hang')} className="bg-indigo-500 text-white px-4 py-2 rounded">Xuất Bảng Word</button>
                            </div>
                            
                            <div id="export-stats">
                                <table className="w-full text-left border-collapse border mb-8">
                                    <caption className="font-bold text-lg mb-2 text-left">Tổng Hợp Sản Phẩm Đã Bán</caption>
                                    <thead>
                                        <tr className="bg-gray-100">
                                            <th className="border p-2">Sản Phẩm</th>
                                            <th className="border p-2">Đơn Vị</th>
                                            <th className="border p-2">Tổng Số Lượng</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {/* Gom nhóm sản phẩm */}
                                        {Object.values(history.reduce((acc, curr) => {
                                            const key = curr.sp + '_' + curr.dv;
                                            if (!acc[key]) acc[key] = { sp: curr.sp, dv: curr.dv, sl: 0 };
                                            acc[key].sl += curr.sl;
                                            return acc;
                                        }, {})).map((item, i) => (
                                            <tr key={i}>
                                                <td className="border p-2">{item.sp}</td>
                                                <td className="border p-2">{item.dv}</td>
                                                <td className="border p-2">{item.sl}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>

                                <table className="w-full text-left border-collapse border">
                                    <caption className="font-bold text-lg mb-2 text-left">Doanh Thu Theo Ngày</caption>
                                    <thead>
                                        <tr className="bg-gray-100">
                                            <th className="border p-2">Ngày</th>
                                            <th className="border p-2">Doanh Số Bán</th>
                                            <th className="border p-2">Lãi (Chênh Lệch)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {Object.values(history.reduce((acc, curr) => {
                                            if (!acc[curr.ngay]) acc[curr.ngay] = { ngay: curr.ngay, doanhSo: 0, lai: 0 };
                                            acc[curr.ngay].doanhSo += curr.thanhTien;
                                            acc[curr.ngay].lai += curr.chenhLech;
                                            return acc;
                                        }, {})).map((item, i) => (
                                            <tr key={i}>
                                                <td className="border p-2">{item.ngay}</td>
                                                <td className="border p-2">{item.doanhSo.toLocaleString()} ₫</td>
                                                <td className="border p-2 text-green-600 font-bold">{item.lai.toLocaleString()} ₫</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
