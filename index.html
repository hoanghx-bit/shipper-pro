
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ứng Dụng Quản Lý Đơn Hàng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8">
  <div class="max-w-6xl mx-auto bg-white shadow-md rounded-lg overflow-hidden">
    
    <!-- Navigation Tabs -->
    <div class="flex border-b bg-slate-800 text-white">
      <button onclick="switchTab('len-don')" id="tab-len-don" class="px-6 py-3 font-semibold border-b-2 border-blue-500 bg-slate-700">Lên Đơn Hàng</button>
      <button onclick="switchTab('kho-hang')" id="tab-kho-hang" class="px-6 py-3 font-semibold hover:bg-slate-700">Kho Hàng</button>
      <button onclick="switchTab('lich-su')" id="tab-lich-su" class="px-6 py-3 font-semibold hover:bg-slate-700">Lịch Sử Đơn Hàng</button>
      <button onclick="switchTab('thong-ke')" id="tab-thong-ke" class="px-6 py-3 font-semibold hover:bg-slate-700">Thống Kê Ngày</button>
    </div>

    <div class="p-6">
      <!-- TAB 1: FORM LÊN ĐƠN HÀNG -->
      <div id="sec-len-don" class="space-y-6">
        <h2 class="text-xl font-bold text-gray-800">Tạo Đơn Hàng Mới</h2>
        <form id="orderForm" onsubmit="addOrder(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Tên Khách Hàng</label>
            <input type="text" id="custName" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Sản Phẩm</label>
            <select id="orderProduct" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500"></select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Số Lượng</label>
            <input type="number" id="orderQty" min="1" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Đơn Vị Tính</label>
            <select id="orderUnit" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
              <option value="Thùng">Thùng</option>
              <option value="Hộp">Hộp</option>
              <option value="Gói">Gói</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded font-semibold hover:bg-blue-700">Lưu Đơn Hàng</button>
          </div>
        </form>
      </div>

      <!-- TAB 2: KHO HÀNG -->
      <div id="sec-kho-hang" class="hidden space-y-6">
        <h2 class="text-xl font-bold text-gray-800">Quản Lý Kho Hàng & Quy Cách</h2>
        <form onsubmit="addProduct(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-gray-50 p-4 rounded border">
          <input type="text" id="pName" placeholder="Tên sản phẩm" required class="border p-2 rounded">
          <input type="number" id="pPrice" placeholder="Đơn giá (VNĐ)" required class="border p-2 rounded">
          <input type="number" id="pSpec" placeholder="Quy cách (Số lẻ/Thùng)" required class="border p-2 rounded" title="Ví dụ: 20 hộp/thùng hoặc 50 gói/thùng">
          <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded font-semibold hover:bg-green-700">Thêm Sản Phẩm</button>
        </form>
        <table class="w-full text-left border-collapse border">
          <thead>
            <tr class="bg-gray-100">
              <th class="border p-2">Tên Sản Phẩm</th>
              <th class="border p-2">Đơn Giá</th>
              <th class="border p-2">Quy Cách (Đơn vị lẻ/Thùng)</th>
            </tr>
          </thead>
          <tbody id="inventoryTable"></tbody>
        </table>
      </div>

      <!-- TAB 3: LỊCH SỬ ĐƠN HÀNG & XUẤT PDF -->
      <div id="sec-lich-su" class="hidden space-y-6">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold text-gray-800">Lịch Sử Đơn Hàng</h2>
          <button onclick="exportPDF()" class="bg-red-600 text-white px-4 py-2 rounded font-semibold hover:bg-red-700">Xuất PDF Đơn Hàng Hôm Nay</button>
        </div>
        <div id="pdfContent" class="space-y-6 p-4 border rounded bg-white">
          <div id="historyList"></div>
        </div>
      </div>

      <!-- TAB 4: THỐNG KÊ BÁN HÀNG -->
      <div id="sec-thong-ke" class="hidden space-y-6">
        <h2 class="text-xl font-bold text-gray-800">Thống Kê Số Lượng Bán Trong Ngày</h2>
        <table class="w-full text-left border-collapse border">
          <thead>
            <tr class="bg-gray-100">
              <th class="border p-2">Sản Phẩm</th>
              <th class="border p-2">Số Lượng Thực Tế Đã Bán</th>
              <th class="border p-2">Quy Đổi Chuẩn (Tự Động)</th>
            </tr>
          </thead>
          <tbody id="statsTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Khởi tạo dữ liệu từ localStorage
    let inventory = JSON.parse(localStorage.getItem('app_inventory')) || [
      { name: 'Bánh Mì', price: 50000, spec: 20 },
      { name: 'Kẹo Thạch', price: 30000, spec: 50 }
    ];
    let orders = JSON.parse(localStorage.getItem('app_orders')) || [];

    function saveData() {
      localStorage.setItem('app_inventory', JSON.stringify(inventory));
      localStorage.setItem('app_orders', JSON.stringify(orders));
    }

    function switchTab(tab) {
      ['len-don', 'kho-hang', 'lich-su', 'thong-ke'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).classList.remove('bg-slate-700', 'border-b-2', 'border-blue-500');
      });
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).classList.add('bg-slate-700', 'border-b-2', 'border-blue-500');
      
      if(tab === 'len-don') renderProductSelect();
      if(tab === 'kho-hang') renderInventory();
      if(tab === 'lich-su') renderHistory();
      if(tab === 'thong-ke') renderStats();
    }

    // Quản lý Kho hàng
    function addProduct(e) {
      e.preventDefault();
      const name = document.getElementById('pName').value.trim();
      const price = parseFloat(document.getElementById('pPrice').value);
      const spec = parseInt(document.getElementById('pSpec').value);
      
      inventory.push({ name, price, spec });
      saveData();
      renderInventory();
      e.target.reset();
    }

    function renderInventory() {
      const tbody = document.getElementById('inventoryTable');
      tbody.innerHTML = inventory.map(p => `
        <tr>
          <td class="border p-2 font-medium">${p.name}</td>
          <td class="border p-2">${p.price.toLocaleString('vi-VN')} VNĐ</td>
          <td class="border p-2">${p.spec} (Hộp/Gói)/Thùng</td>
        </tr>
      `).join('');
    }

    function renderProductSelect() {
      const select = document.getElementById('orderProduct');
      select.innerHTML = inventory.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
    }

    // Quản lý Đơn hàng
    function addOrder(e) {
      e.preventDefault();
      const customer = document.getElementById('custName').value.trim();
      const product = document.getElementById('orderProduct').value;
      const quantity = parseFloat(document.getElementById('orderQty').value);
      const unit = document.getElementById('orderUnit').value;
      const date = new Date().toISOString().split('T')[0];

      orders.push({ id: Date.now(), customer, product, quantity, unit, date });
      saveData();
      alert('Đã lưu đơn hàng thành công!');
      document.getElementById('orderForm').reset();
    }

    // Lịch sử Đơn hàng & In PDF
    function renderHistory() {
      const today = new Date().toISOString().split('T')[0];
      const todayOrders = orders.filter(o => o.date === today);
      const historyDiv = document.getElementById('historyList');

      if (todayOrders.length === 0) {
        historyDiv.innerHTML = '<p class="text-gray-500 italic">Chưa có đơn hàng nào trong ngày hôm nay.</p>';
        return;
      }

      // Nhóm đơn hàng theo Tên Khách Hàng
      const grouped = todayOrders.reduce((acc, order) => {
        acc[order.customer] = acc[order.customer] || [];
        acc[order.customer].push(order);
        return acc;
      }, {});

      historyDiv.innerHTML = Object.keys(grouped).map(cust => `
        <div class="border-b pb-4 mb-4 last:border-0">
          <div class="text-lg font-bold text-blue-900 border-b pb-1 mb-2">${cust}</div>
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="text-gray-600">
                <th class="py-1">Sản Phẩm</th>
                <th class="py-1">Số Lượng</th>
                <th class="py-1">Đơn Vị Tính</th>
              </tr>
            </thead>
            <tbody>
              ${grouped[cust].map(item => `
                <tr>
                  <td class="py-1">${item.product}</td>
                  <td class="py-1">${item.quantity}</td>
                  <td class="py-1">${item.unit}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `).join('');
    }

    function exportPDF() {
      const element = document.getElementById('pdfContent');
      const today = new Date().toISOString().split('T')[0];
      const opt = {
        margin:       10,
        filename:     `Don_Hang_${today}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    // Thống kê & Quy đổi tự động
    function renderStats() {
      const today = new Date().toISOString().split('T')[0];
      const todayOrders = orders.filter(o => o.date === today);
      const tbody = document.getElementById('statsTable');

      // Gom tổng số lượng theo sản phẩm và đơn vị
      const stats = {};
      todayOrders.forEach(o => {
        if (!stats[o.product]) {
          stats[o.product] = { Thùng: 0, Hộp: 0, Gói: 0 };
        }
        stats[o.product][o.unit] += o.quantity;
      });

      tbody.innerHTML = Object.keys(stats).map(pName => {
        const item = inventory.find(i => i.name === pName);
        const spec = item ? item.spec : 1; // Số đơn vị lẻ / thùng
        
        let rawThung = stats[pName]['Thùng'];
        let rawLe = stats[pName]['Hộp'] + stats[pName]['Gói'];

        // Thuật toán quy đổi tự động thành 0.5 hoặc 1 thùng
        let convertedThung = rawThung;
        let leConLai = rawLe;

        if (spec > 0 && rawLe > 0) {
          const ratio = rawLe / spec;
          const fullThung = Math.floor(ratio);
          const remainderRatio = ratio - fullThung;

          convertedThung += fullThung;
          leConLai = rawLe % spec;

          if (remainderRatio >= 0.75) {
            convertedThung += 1;
            leConLai = 0;
          } else if (remainderRatio >= 0.4) { // Đạt từ ~0.5 thùng
            convertedThung += 0.5;
            leConLai = Math.round(rawLe - (fullThung + 0.5) * spec);
            if (leConLai < 0) leConLai = 0;
          }
        }

        return `
          <tr>
            <td class="border p-2 font-medium">${pName}</td>
            <td class="border p-2">
              ${stats[pName]['Thùng'] ? stats[pName]['Thùng'] + ' Thùng ' : ''}
              ${stats[pName]['Hộp'] ? stats[pName]['Hộp'] + ' Hộp ' : ''}
              ${stats[pName]['Gói'] ? stats[pName]['Gói'] + ' Gói' : ''}
            </td>
            <td class="border p-2 font-bold text-blue-700">
              ${convertedThung > 0 ? convertedThung + ' Thùng ' : ''}
              ${leConLai > 0 ? `(+ ${leConLai} Hộp/Gói lẻ)` : ''}
            </td>
          </tr>
        `;
      }).join('');
    }

    // Khởi tạo trang ban đầu
    renderProductSelect();
  </script>
</body>
</html>
